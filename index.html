<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flex Cash</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .card {
      background-color: #1e293b;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      box-sizing: border-box;
    }
    .balance-label {
      font-size: 14px;
      color: #94a3b8;
    }
    .balance-amount {
      font-size: 32px;
      font-weight: bold;
      color: #10b981;
      margin: 10px 0;
    }
    .reward-info {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }
    .btn {
      background-color: #10b981;
      color: #000000;
      border: none;
      width: 100%;
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:active {
      opacity: 0.8;
    }
    .btn-deposit {
      background-color: #3b82f6;
      color: #ffffff;
    }
    .btn-withdraw {
      background-color: #ef4444;
      color: #ffffff;
    }
    .btn-full {
      grid-column: span 2;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      width: 85%;
      max-width: 300px;
      text-align: left;
    }
    .modal-content h3 {
      margin-top: 0;
      color: #10b981;
    }
    .input-field {
      width: 100%;
      padding: 10px;
      margin: 8px 0 14px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      box-sizing: border-box;
    }
    .close-btn {
      background: #64748b;
      color: white;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>🚀 ফ্লেক্স ক্যাশ 💸</h2>
  </div>

  <div class="card">
    <div class="balance-label">আপনার ব্যালেন্স</div>
    <div class="balance-amount">TK <span id="balance">500.00</span></div>
    <div class="reward-info">প্রতি অ্যাডে পাবেন: TK 20.00</div>
    
    <div class="grid-container">
      <button class="btn btn-full" onclick="addReward()">📺 বিজ্ঞাপন দেখুন</button>
      <button class="btn btn-deposit" onclick="openModal('depositModal')">📥 ডিপোজিট</button>
      <button class="btn btn-withdraw" onclick="openModal('withdrawModal')">📤 উইথড্র</button>
    </div>
  </div>

  <!-- Deposit Modal -->
  <div id="depositModal" class="modal">
    <div class="modal-content">
      <h3>ডিপোজিট করুন</h3>
      <label>পেমেন্ট মেথড:</label>
      <select class="input-field">
        <option>বিকাশ (Bkash)</option>
        <option>নগদ (Nagad)</option>
        <option>রকেট (Rocket)</option>
      </select>
      <label>টাকার পরিমাণ:</label>
      <input type="number" class="input-field" placeholder="যেমন: 500">
      <label>ট্রানজেকশন আইডি (TrxID):</label>
      <input type="text" class="input-field" placeholder="TrxID লিখুন">
      <button class="btn btn-deposit" onclick="submitDeposit()">জমা দিন</button>
      <button class="btn close-btn" onclick="closeModal('depositModal')">বন্ধ করুন</button>
    </div>
  </div>

  <!-- Withdraw Modal -->
  <div id="withdrawModal" class="modal">
    <div class="modal-content">
      <h3>টাকা উত্তোলন (Withdraw)</h3>
      <label>মেথড সিলেক্ট করুন:</label>
      <select class="input-field">
        <option>বিকাশ</option>
        <option>নগদ</option>
      </select>
      <label>একাউন্ট নম্বর:</label>
      <input type="text" class="input-field" placeholder="017XXXXXXXX">
      <label>টাকার পরিমাণ:</label>
      <input type="number" id="withdrawAmount" class="input-field" placeholder="সর্বনিম্ন 500">
      <button class="btn btn-withdraw" onclick="submitWithdraw()">উইথড্র রিকোয়েস্ট</button>
      <button class="btn close-btn" onclick="closeModal('withdrawModal')">বন্ধ করুন</button>
    </div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    let currentBalance = 500.00;

    function updateBalanceUI() {
      document.getElementById('balance').innerText = currentBalance.toFixed(2);
    }

    function addReward() {
      currentBalance += 20.00;
      updateBalanceUI();
      alert("বিজ্ঞাপন দেখার জন্য ২০ টাকা যোগ হয়েছে!");
    }

    function openModal(id) {
      document.getElementById(id).style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function submitDeposit() {
      alert("ডিপোজিট রিকোয়েস্ট সফল হয়েছে! অ্যাডমিন যাচাই করে ব্যালেন্স যুক্ত করবে।");
      closeModal('depositModal');
    }

    function submitWithdraw() {
      let amount = parseFloat(document.getElementById('withdrawAmount').value);
      if (isNaN(amount) || amount <= 0) {
        alert("সঠিক পরিমাণ লিখুন!");
        return;
      }
      if (amount > currentBalance) {
        alert("আপনার পর্যাপ্ত ব্যালেন্স নেই!");
        return;
      }
      currentBalance -= amount;
      updateBalanceUI();
      alert("উইথড্র রিকোয়েস্ট জমা হয়েছে!");
      closeModal('withdrawModal');
    }
  </script>

</body>
</html>
