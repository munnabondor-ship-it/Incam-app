<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flex Cash</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .card {
      background-color: #1e293b;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .balance-label {
      font-size: 14px;
      color: #94a3b8;
    }
    .balance-amount {
      font-size: 32px;
      font-weight: bold;
      color: #10b981;
      margin: 10px 0;
    }
    .reward-info {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    .btn {
      background-color: #10b981;
      color: #000000;
      border: none;
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>🚀 ফ্লেক্স ক্যাশ 💸</h2>
  </div>

  <div class="card">
    <div class="balance-label">আপনার ব্যালেন্স</div>
    <div class="balance-amount">TK <span id="balance">500.00</span></div>
    <div class="reward-info">প্রতি অ্যাডে পাবেন: TK 20.00</div>
    <button class="btn" onclick="addReward()">বিজ্ঞাপন দেখুন</button>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    let currentBalance = 500.00;

    function addReward() {
      currentBalance += 20.00;
      document.getElementById('balance').innerText = currentBalance.toFixed(2);
    }
  </script>

</body>
</html>
